name: CI

on:
  push:
    branches: [main]
    # Was on `pull_request` only, which missed the case that actually happens
    # here: this project commits straight to main, and every completed item is
    # followed by a small commit that touches ONLY docs/PROGRESS.md to record
    # the SHA. Without this, each of those paid for a full verify + e2e run to
    # prove a markdown edit had not broken Postgres.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: every PR push. Lint, types, unit tests, build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Points at the throwaway service above. Real credentials live in
      # Vercel/GitHub secrets and never in the repo (master PRD §7.4).
      - name: Provision CI env
        run: |
          {
            echo 'DATABASE_URL=postgresql://ci:ci@localhost:5432/ci'
            echo 'DIRECT_URL=postgresql://ci:ci@localhost:5432/ci'
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo 'AUTH_URL=http://localhost:3000'
          } > .env.local

      - run: npm run db:generate

      - name: Apply migrations
        run: npx dotenv -e .env.local -- npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Seed roles and permissions
        run: npm run db:seed

      - name: Check for schema drift
        run: |
          npx dotenv -e .env.local -- npx prisma migrate diff \
            --from-schema-datasource packages/db/prisma/schema.prisma \
            --to-schema-datamodel packages/db/prisma/schema.prisma \
            --exit-code

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Heavy lane: merges to main and non-draft PRs only.
  # 60-min cap: this repo previously had NO timeout and inherited GitHub's
  # 6-hour max — same exposure that burned rental-business once.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    if: github.ref == 'refs/heads/main' || github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Provision CI env
        run: |
          {
            echo 'DATABASE_URL=postgresql://ci:ci@localhost:5432/ci'
            echo 'DIRECT_URL=postgresql://ci:ci@localhost:5432/ci'
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo 'AUTH_URL=http://localhost:3000'
          } > .env.local

      - run: npm run db:generate

      - name: Apply migrations
        run: npx dotenv -e .env.local -- npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Seed roles and permissions
        run: npm run db:seed

      # e2e asserts against demo facilities by name — heavy lane only.
      - name: Seed demo facilities for e2e
        run: npm run db:seed:demo

      - run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Covers the axe accessibility scan (master PRD §7.2) and the smoke suite.
      - name: End-to-end + axe
        run: npm run test:e2e

      # Core Web Vitals budgets from master PRD §7.3, asserted in lighthouserc.json.
      - name: Lighthouse
        run: npx lhci autorun

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Reported, not enforced: see _overrides_note in package.json.
      - name: Dependency audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=moderate
